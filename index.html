<style>
  :root {
    --cream: #fff8d6;
    --sun: #ffd93b;
    --sun-deep: #f5b800;
    --leaf: #4fae5a;
    --leaf-deep: #2f8f44;
    --ink: #6b4a1f;
    --pink: #ff9eb5;
    --hand: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
    --body: 'Quicksand', ui-rounded, 'SF Pro Rounded', system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--body);
    color: var(--ink);
    background: linear-gradient(180deg, #fff2a8 0%, #fff8d6 45%, #e9f7c8 100%);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- sol ---------- */
  .sun {
    position: fixed; top: -70px; right: -70px; width: 220px; height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff6a8 0 38%, #ffe25c 39% 60%, rgba(255,226,92,0) 62%);
    animation: pulse 5s ease-in-out infinite;
    pointer-events: none;
  }
  .sun::before {
    content: ''; position: absolute; inset: -40px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg, rgba(255,217,59,.45) 0 8deg, transparent 8deg 22deg);
    -webkit-mask: radial-gradient(circle, transparent 0 40%, #000 41% 70%, transparent 71%);
            mask: radial-gradient(circle, transparent 0 40%, #000 41% 70%, transparent 71%);
    animation: spin 40s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  /* ---------- nubes ---------- */
  .cloud {
    position: fixed; height: 34px; width: 90px; background: #fff; border-radius: 40px;
    opacity: .85; filter: drop-shadow(0 4px 0 rgba(255,255,255,.4));
    animation: drift linear infinite; pointer-events: none;
  }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
  .cloud::before { width: 42px; height: 42px; top: -20px; left: 14px; }
  .cloud::after { width: 32px; height: 32px; top: -13px; left: 46px; }
  @keyframes drift { from { transform: translateX(-140px); } to { transform: translateX(calc(100vw + 140px)); } }

  /* ---------- sobre (intro) ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
    cursor: pointer; transition: opacity .8s ease, transform .8s ease;
  }
  #intro.gone { opacity: 0; transform: scale(1.15); pointer-events: none; }
  .envelope {
    position: relative; width: min(74vw, 300px); aspect-ratio: 3 / 2;
    background: #ffe36e; border-radius: 12px;
    box-shadow: 0 14px 0 -4px rgba(245,184,0,.35), 0 20px 30px rgba(140,100,0,.25);
    animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(-1.5deg); } }
  .envelope .flap {
    position: absolute; left: 0; top: 0; width: 100%; height: 58%;
    background: #ffd23c; clip-path: polygon(0 0, 100% 0, 50% 100%);
    border-radius: 12px 12px 0 0; transform-origin: top; z-index: 3;
    transition: transform .6s ease .1s;
  }
  .envelope .pocket {
    position: absolute; inset: 0; z-index: 2; border-radius: 12px;
    background:
      linear-gradient(35deg, #ffc61a 0 50%, transparent 50%) left / 50% 100% no-repeat,
      linear-gradient(-35deg, #ffc61a 0 50%, transparent 50%) right / 50% 100% no-repeat;
    clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%);
  }
  .envelope .seal {
    position: absolute; left: 50%; top: 50%; width: 22%; transform: translate(-50%, -50%);
    z-index: 4; transition: opacity .3s;
  }
  .envelope .note {
    position: absolute; left: 8%; right: 8%; top: 10%; bottom: 10%; background: #fff; border-radius: 6px; z-index: 1;
    transition: transform .7s ease .35s;
  }
  #intro.opening .flap { transform: rotateX(180deg); z-index: 0; }
  #intro.opening .seal { opacity: 0; }
  #intro.opening .note { transform: translateY(-46%); }
  #intro .hint {
    font-family: var(--hand); font-size: 2rem; font-weight: 700; text-align: center; line-height: 1.1;
    animation: pulse 1.8s ease-in-out infinite;
  }
  #intro .hint small { display: block; font-family: var(--body); font-size: .85rem; font-weight: 500; opacity: .7; margin-top: 6px; }

  /* ---------- jardín ---------- */
  #garden { position: fixed; left: 0; right: 0; bottom: 0; height: 100%; pointer-events: none; z-index: 5; }
  .ground {
    position: absolute; left: -5%; right: -5%; bottom: -30px; height: 92px; z-index: 6;
    background:
      radial-gradient(ellipse 60% 100% at 20% 100%, #6cc36f 0 60%, transparent 61%),
      radial-gradient(ellipse 55% 100% at 75% 100%, #5db863 0 60%, transparent 61%),
      linear-gradient(#58b25f, #3f9a4a);
    border-radius: 50% 50% 0 0 / 40% 40% 0 0;
    transform: translateY(120%); transition: transform 1s cubic-bezier(.2,1.2,.4,1);
  }
  #garden.on .ground { transform: none; }
  .flower { position: absolute; bottom: 42px; width: 0; height: 0; z-index: 7;
    transform-origin: 0 0; animation: sway 3.6s ease-in-out infinite alternate; animation-delay: var(--sd); }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  .stem {
    position: absolute; bottom: 0; left: -3px; width: 6px; height: var(--h);
    background: linear-gradient(90deg, #3f9a4a, #5cc06a); border-radius: 3px;
    transform-origin: bottom; transform: scaleY(0);
    animation: grow 1.3s var(--d) cubic-bezier(.3,1.15,.5,1) forwards;
  }
  @keyframes grow { to { transform: scaleY(1); } }
  .leaf {
    position: absolute; width: 22px; height: 12px; background: var(--leaf); bottom: 30%;
    border-radius: 0 100% 0 100%;
  }
  .leaf.l { right: 5px; transform: scaleX(-1) rotate(-15deg); transform-origin: right bottom; }
  .leaf.r { left: 5px; transform: rotate(-15deg); transform-origin: left bottom; bottom: 46%; }
  .head {
    position: absolute; bottom: var(--h); left: calc(var(--s) / -2); width: var(--s); height: var(--s);
    margin-bottom: calc(var(--s) / -2); overflow: visible;
    transform: scale(0) rotate(-120deg);
    animation: bloom 1s calc(var(--d) + 1s) cubic-bezier(.3,1.7,.5,1) forwards;
    filter: drop-shadow(0 3px 0 rgba(200,140,0,.25));
  }
  @keyframes bloom { to { transform: scale(1) rotate(0); } }
  .head .spin { transform-origin: 0 0; animation: slowspin 22s linear infinite; }
  @keyframes slowspin { to { transform: rotate(360deg); } }

  /* ---------- bichitos y pétalos ---------- */
  .critter { position: fixed; z-index: 9; pointer-events: none; font-size: 26px; will-change: transform; }
  .bee { top: 45%; left: -40px; animation: fly1 14s linear infinite; }
  .bee.b2 { top: 58%; font-size: 20px; animation: fly2 18s linear infinite 3s; }
  .butter { top: 30%; left: -40px; font-size: 28px; animation: fly3 20s linear infinite 6s; }
  @keyframes fly1 {
    0% { transform: translate(-10vw, 0); } 25% { transform: translate(28vw, -40px) rotate(8deg); }
    50% { transform: translate(55vw, 20px) rotate(-6deg); } 75% { transform: translate(82vw, -50px) rotate(6deg); }
    100% { transform: translate(115vw, 0); }
  }
  @keyframes fly2 {
    0% { transform: translate(110vw, 0) scaleX(-1); } 30% { transform: translate(70vw, 30px) scaleX(-1); }
    60% { transform: translate(35vw, -30px) scaleX(-1); } 100% { transform: translate(-15vw, 10px) scaleX(-1); }
  }
  @keyframes fly3 {
    0% { transform: translate(-10vw, 0); } 20% { transform: translate(20vw, 40px); }
    40% { transform: translate(45vw, -20px); } 60% { transform: translate(65vw, 50px); }
    80% { transform: translate(90vw, -10px); } 100% { transform: translate(115vw, 20px); }
  }
  .petal {
    position: fixed; top: -20px; z-index: 8; pointer-events: none; width: 12px; height: 18px;
    background: radial-gradient(ellipse at 40% 30%, #fff2a0, #ffd93b 70%); border-radius: 60% 40% 60% 40%;
    animation: fall linear forwards; opacity: .9;
  }
  @keyframes fall {
    0% { transform: translate(0, 0) rotate(0); }
    50% { transform: translate(var(--dx), 50vh) rotate(180deg); }
    100% { transform: translate(calc(var(--dx) * -.5), 108vh) rotate(420deg); opacity: .6; }
  }
  .spark {
    position: fixed; z-index: 10; pointer-events: none; font-size: 20px;
    animation: pop 1s ease-out forwards;
  }
  @keyframes pop { from { transform: translate(-50%, -50%) scale(.3); opacity: 1; } to { transform: translate(-50%, -140%) scale(1.2); opacity: 0; } }

  /* ---------- tarjeta ---------- */
  #card {
    position: fixed; z-index: 12; left: 50%; top: max(7vh, env(safe-area-inset-top));
    width: min(88vw, 430px); transform: translate(-50%, -30px) scale(.9); opacity: 0;
    background: rgba(255,255,255,.78); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 3px solid #fff; border-radius: 28px; padding: 20px 22px 22px; text-align: center;
    box-shadow: 0 10px 0 -2px rgba(245,184,0,.35), 0 18px 32px rgba(140,100,0,.2);
    transition: opacity .8s ease, transform .9s cubic-bezier(.3,1.4,.5,1);
    pointer-events: none;
  }
  #card.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #card .msg {
    font-family: var(--hand); font-weight: 700; font-size: clamp(2.2rem, 9.5vw, 3rem);
    line-height: 1.05; color: #e0a100; min-height: 2.1em; margin: 0;
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 2px 0 rgba(255,255,255,.9);
  }
  #card .msg::after { content: '|'; margin-left: 2px; opacity: .5; animation: blink .8s steps(2) infinite; }
  #card.done .msg::after { content: ''; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- ramo ---------- */
  .bq {
    position: fixed; left: 0; right: 0; bottom: 22px; z-index: 8;
    display: flex; justify-content: center; pointer-events: none;
  }
  .bq svg { width: min(90vw, 400px); height: auto; overflow: visible; transform-origin: 50% 100%; }
  #bq.on svg { animation: bqsway 5s ease-in-out infinite alternate 3s; }
  @keyframes bqsway { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
  .bq .wrap, .bq .lv { opacity: 0; }
  #bq.on .wrap { animation: wrapUp 1s cubic-bezier(.3,1.35,.5,1) forwards; }
  #bq.on .lv { animation: leafIn .9s ease-out forwards; animation-delay: var(--d); }
  @keyframes wrapUp { from { transform: translateY(70px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes leafIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .bq .bs { stroke-dasharray: 1; stroke-dashoffset: 1; }
  #bq.on .bs { animation: draw 1.1s var(--d) ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .bq .bl { transform: scale(0) rotate(-120deg); transform-origin: 0 0; }
  #bq.on .bl { animation: bloom 1s var(--d) cubic-bezier(.3,1.7,.5,1) forwards; }

  @media (prefers-reduced-motion: reduce) {
    .cloud, .critter, .sun::before { animation: none; }
  }
</style>
</head>

<script>
  // ============================================================
  //  EDITA AQUÍ EL MENSAJE
  // ============================================================
  const MENSAJE = 'Estas flores amarillas son para ti';
  // ============================================================

  const $ = (s) => document.querySelector(s);
  const garden = $('#garden');
  const card = $('#card');
  const msgEl = $('#msg');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let petalTimer = null, typeTimer = null, sparkTimer = null, started = false;


  const rand = (a, b) => a + Math.random() * (b - a);

  function plantFlowers() {
    garden.querySelectorAll('.flower').forEach((n) => n.remove());
    const W = innerWidth, H = innerHeight;
    const n = Math.max(8, Math.min(18, Math.round(W / 45)));
    const bqHalf = (Math.min(W * 0.9, 400) / 2 / W) * 100 * 0.55;
    for (let i = 0; i < n; i++) {
      const x = ((i + 0.5) / n) * 100 + rand(-2, 2);
      if (Math.abs(x - 50) < bqHalf) continue;
      const size = rand(58, 92) * (W < 500 ? 1 : 1.2);
      const h = rand(0.10, 0.28) * H;
      const delay = i * 0.12 + rand(0, 0.2);
      const f = document.createElement('div');
      f.className = 'flower';
      f.style.cssText = `left:${x}%;--h:${h}px;--s:${size}px;--d:${delay}s;--sd:${rand(-3, 0)}s`;
      f.innerHTML =
        '<div class="stem"><i class="leaf l"></i><i class="leaf r"></i></div>' +
        '<svg class="head" viewBox="-50 -50 100 100"><use href="#fh"/></svg>';
      garden.appendChild(f);
    }
  }

  function spawnPetal() {
    const p = document.createElement('div');
    p.className = 'petal';
    p.style.left = rand(0, 100) + 'vw';
    p.style.setProperty('--dx', rand(-70, 70) + 'px');
    p.style.animationDuration = rand(7, 12) + 's';
    p.style.transform = `scale(${rand(.7, 1.3)})`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 13000);
  }

  function sparkle(x, y) {
    const s = document.createElement('div');
    s.className = 'spark';
    s.textContent = ['✨', '💛', '🌼', '⭐'][Math.floor(Math.random() * 4)];
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }

  function typeMessage() {
    clearInterval(typeTimer);
    msgEl.textContent = '';
    card.classList.remove('done');
    let i = 0;
    const speed = reduce ? 4 : 38;
    typeTimer = setInterval(() => {
      msgEl.textContent = MENSAJE.slice(0, ++i);
      if (i >= MENSAJE.length) {
        clearInterval(typeTimer);
        card.classList.add('done');
      }
    }, speed);
  }

  function startScene() {
    plantFlowers();
    garden.classList.remove('on');
    void garden.offsetWidth;
    garden.classList.add('on');
    const bq = $('#bq');
    bq.classList.remove('on'); void bq.offsetWidth; bq.classList.add('on');
    clearInterval(petalTimer);
    petalTimer = setInterval(spawnPetal, 650);
    clearInterval(sparkTimer);
    sparkTimer = setInterval(() => {
      const r = bq.getBoundingClientRect();
      sparkle(r.left + rand(0, r.width), r.top + rand(0, r.height * 0.6));
    }, 900);
    for (let i = 0; i < 6; i++) setTimeout(spawnPetal, i * 120);
    card.classList.remove('show', 'done');
    msgEl.textContent = '';
    setTimeout(() => { card.classList.add('show'); setTimeout(typeMessage, 700); }, 2600);
  }

  function openEnvelope() {
    if (started) return;
    started = true;
    const intro = $('#intro');
    intro.classList.add('opening');
    setTimeout(() => intro.classList.add('gone'), 1100);
    setTimeout(startScene, 900);
    if (navigator.vibrate) navigator.vibrate(30);
  }

  $('#intro').addEventListener('click', openEnvelope);
  $('#intro').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') openEnvelope(); });

  // Toca en cualquier parte para soltar chispitas
  addEventListener('pointerdown', (e) => { if (started && !e.target.closest('button')) sparkle(e.clientX, e.clientY); });

  // Si giran el móvil, replantar
  let rt;
  addEventListener('resize', () => { if (!started) return; clearTimeout(rt); rt = setTimeout(plantFlowers, 300); });
</script>
</body>
</html>
